spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.name=defaultDataSource
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/yolo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false}
spring.datasource.username=${MYSQL_USERNAME:yolo_user}
spring.datasource.password=${MYSQL_PASSWORD:}

spring.datasource.initialization-mode=never
spring.datasource.hikari.maximum-pool-size=${MYSQL_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

file.ip=${FILE_PUBLIC_HOST:localhost}
file.upload-dir=${FILE_UPLOAD_DIR:files}

deepseek.api-key=${DEEPSEEK_API_KEY:}
deepseek.api-url=${DEEPSEEK_API_URL:https://api.deepseek.com/chat/completions}
deepseek.model=${DEEPSEEK_MODEL:deepseek-v4-pro}
