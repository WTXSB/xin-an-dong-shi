spring.application.name=Ece-test
server.port=0
file.ip=localhost
file.upload-dir=files

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:yolo-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.initialization-mode=always
spring.datasource.schema=classpath:demo-schema.sql
spring.datasource.data=classpath:demo-data.sql

mybatis.mapper-locations=classpath:mappers/*xml
mybatis.type-aliases-package=com.example.Ece.mybatis.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true

deepseek.api-key=
deepseek.api-url=https://api.deepseek.com/chat/completions
deepseek.model=deepseek-v4-pro
deepseek.chat-model=deepseek-flash
