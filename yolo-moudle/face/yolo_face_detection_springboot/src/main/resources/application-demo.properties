spring.application.name=Ece
server.port=9999
file.ip=localhost
file.upload-dir=files

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:yolo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.initialization-mode=always
spring.datasource.schema=classpath:demo-schema.sql
spring.datasource.data=classpath:demo-data.sql

mybatis.mapper-locations=classpath:mappers/*xml
mybatis.type-aliases-package=com.example.Ece.mybatis.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

deepseek.api-key=${DEEPSEEK_API_KEY:}
deepseek.api-url=${DEEPSEEK_API_URL:https://api.deepseek.com/chat/completions}
deepseek.model=${DEEPSEEK_MODEL:deepseek-v4-pro}
